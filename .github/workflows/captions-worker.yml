name: Captions Worker Checks

on:
  pull_request:
    paths:
      - "services/captions-worker/**"
      - ".github/workflows/captions-worker.yml"
  push:
    branches:
      - feature/ai-auto-captions-generator
    paths:
      - "services/captions-worker/**"
      - ".github/workflows/captions-worker.yml"

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/captions-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        run: npm install
      - name: Validate caption style catalog
        run: npm test
      - name: Validate Python syntax
        run: python -m py_compile src/transcribe.py src/render.py
